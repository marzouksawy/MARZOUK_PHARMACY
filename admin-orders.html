<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الطلبات — صيدلية د. مرزوق الصاوي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E2A2E; --petrol:#0F4C4F; --petrol-deep:#0A3638;
    --cream:#F6F2EA; --paper:#FFFEFB; --amber:#D98C4A; --line:rgba(14,42,46,0.12);
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'IBM Plex Sans Arabic', sans-serif; background:var(--cream); color:var(--ink); padding-bottom:40px;}
  h1,h2,h3{font-family:'Tajawal';}
  header{
    background:var(--petrol-deep); color:#fff; padding:14px 18px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;
    position:sticky; top:0; z-index:20;
  }
  header h1{font-size:16px; margin:0;}
  header .actions{display:flex; gap:8px; align-items:center;}
  header a, header button{
    background:rgba(255,255,255,0.12); color:#fff; border:none; padding:8px 14px;
    border-radius:999px; font-family:'IBM Plex Sans Arabic'; font-size:13px; cursor:pointer; text-decoration:none;
  }
  .wrap{max-width:640px; margin:0 auto; padding:16px;}

  .tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px;}
  .tabs button{
    flex-shrink:0; border:1px solid var(--line); background:var(--paper); color:var(--ink);
    padding:9px 14px; border-radius:999px; font-family:'IBM Plex Sans Arabic'; font-size:12.5px; cursor:pointer;
    white-space:nowrap;
  }
  .tabs button.active{background:var(--petrol); color:#fff; border-color:var(--petrol);}
  .tabs button .count{opacity:0.75; margin-right:4px;}

  #search-box{width:100%; padding:11px 14px; border-radius:10px; border:1px solid var(--line); font-family:'IBM Plex Sans Arabic'; background:var(--paper); margin-bottom:16px;}

  .order-card{background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px;}
  .order-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px;}
  .order-head .oid{font-family:'Tajawal'; font-weight:700; font-size:14.5px; margin:0;}
  .order-head .odate{font-size:11.5px; color:rgba(14,42,46,0.55); margin:2px 0 0;}
  .status-badge{font-size:11px; padding:4px 11px; border-radius:999px; font-weight:700; white-space:nowrap;}
  .status-pending{background:#FDF1DC; color:#B4700E;}
  .status-preparing{background:#E6F0FB; color:#1B5FA8;}
  .status-out_for_delivery{background:#F0E7FB; color:#6B3FA0;}
  .status-delivered{background:#E6F4EE; color:#1B8A5A;}
  .status-cancelled{background:#FBEAEA; color:#C0392B;}

  .customer-line{font-size:13.5px; margin:4px 0; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .customer-line a{color:var(--petrol); text-decoration:none; font-weight:700;}
  .delivery-note{font-size:12.5px; color:rgba(14,42,46,0.7); background:var(--cream); border-radius:8px; padding:8px 10px; margin:8px 0;}

  .items-list{margin:10px 0; border-top:1px solid var(--line); padding-top:8px;}
  .item-row{display:flex; justify-content:space-between; font-size:13px; padding:3px 0;}
  .item-row .name{color:var(--ink);}
  .item-row .sub{color:rgba(14,42,46,0.55); font-size:11.5px; margin-right:4px;}

  .order-total{display:flex; justify-content:space-between; align-items:center; padding-top:10px; margin-top:6px; border-top:2px solid var(--petrol);}
  .order-total .label{font-family:'Tajawal'; font-weight:700; font-size:13.5px;}
  .order-total .value{font-family:'Tajawal'; font-weight:800; font-size:16.5px; color:var(--petrol);}

  .notes-line{font-size:12.5px; color:rgba(14,42,46,0.7); margin-top:8px; font-style:italic;}

  .order-actions{display:flex; gap:8px; margin-top:14px; align-items:center; flex-wrap:wrap;}
  .order-actions select{
    flex:1; min-width:140px; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
    font-family:'IBM Plex Sans Arabic'; font-size:13px; background:var(--cream);
  }
  .wa-btn{
    background:#1FA855; color:#fff; border:none; padding:10px 14px; border-radius:8px;
    font-family:'IBM Plex Sans Arabic'; font-size:13px; cursor:pointer; text-decoration:none; flex-shrink:0;
  }
  .save-hint{font-size:11.5px; color:var(--petrol); margin-top:6px; min-height:15px;}

  .empty-state, .loading{text-align:center; padding:50px 20px; color:rgba(14,42,46,0.55); font-size:14px;}
</style>
</head>
<body>

<header>
  <h1>📦 الطلبات</h1>
  <div class="actions">
    <a href="admin-dashboard.html">اللوحة الرئيسية</a>
    <button id="logout-btn">خروج</button>
  </div>
</header>

<div class="wrap">
  <div class="tabs" id="status-tabs"></div>
  <input id="search-box" type="text" placeholder="🔍 ابحث برقم الطلب أو اسم العميل أو رقم الموبايل...">
  <div id="orders-area" class="loading">جاري تحميل الطلبات...</div>
</div>

<script type="module">
import { requireAdminAuth, db, doc, setDoc, getDocs, collection, logout } from "./firebase-config.js";
import { COLLECTIONS, ORDER_STATUS, ORDER_STATUS_LABELS_AR } from "./constants.js";
import { formatPrice, formatDateAr, buildWhatsAppLink } from "./utils.js";

let allOrders = [];
let activeStatus = "all"; // "all" أو أحد قيم ORDER_STATUS
let searchTerm = "";

const tabsEl = document.getElementById("status-tabs");
const ordersArea = document.getElementById("orders-area");
const searchBox = document.getElementById("search-box");

function toWhatsAppIntl(localPhone) {
  // تحويل رقم مصري محلي 01xxxxxxxxx إلى صيغة دولية 20xxxxxxxxxx لواتساب
  const digits = (localPhone || "").replace(/\D/g, "");
  if (digits.startsWith("0")) return "20" + digits.slice(1);
  if (digits.startsWith("20")) return digits;
  return digits;
}

function buildTabs() {
  const counts = { all: allOrders.length };
  Object.values(ORDER_STATUS).forEach(s => {
    counts[s] = allOrders.filter(o => o.status === s).length;
  });

  const tabsData = [
    { key: "all", label: "الكل" },
    ...Object.values(ORDER_STATUS).map(s => ({ key: s, label: ORDER_STATUS_LABELS_AR[s] })),
  ];

  tabsEl.innerHTML = tabsData.map(t => `
    <button data-key="${t.key}" class="${activeStatus === t.key ? "active" : ""}">
      ${t.label} <span class="count">(${counts[t.key] || 0})</span>
    </button>`).join("");

  tabsEl.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      activeStatus = btn.getAttribute("data-key");
      buildTabs();
      renderOrders();
    });
  });
}

function getFiltered() {
  let list = allOrders.slice();
  if (activeStatus !== "all") list = list.filter(o => o.status === activeStatus);
  if (searchTerm) {
    const t = searchTerm.toLowerCase();
    list = list.filter(o =>
      (o.order_id || "").toLowerCase().includes(t) ||
      (o.customer_name || "").toLowerCase().includes(t) ||
      (o.customer_phone || "").includes(t)
    );
  }
  // الأحدث أولًا
  list.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
  return list;
}

function statusOptions(selected) {
  return Object.values(ORDER_STATUS).map(s =>
    `<option value="${s}" ${s === selected ? "selected" : ""}>${ORDER_STATUS_LABELS_AR[s]}</option>`
  ).join("");
}

function renderOrders() {
  const list = getFiltered();
  if (!list.length) {
    ordersArea.innerHTML = `<div class="empty-state">مفيش طلبات في هذا التصنيف حاليًا.</div>`;
    return;
  }

  ordersArea.innerHTML = list.map(o => {
    const waIntl = toWhatsAppIntl(o.customer_phone);
    const waLink = buildWhatsAppLink(waIntl, `أهلًا ${o.customer_name}، بخصوص طلبك رقم ${o.order_id}`);
    return `
    <div class="order-card" data-id="${o.id}">
      <div class="order-head">
        <div>
          <p class="oid">${o.order_id || o.id}</p>
          <p class="odate">${o.created_at ? formatDateAr(o.created_at) : "—"}</p>
        </div>
        <span class="status-badge status-${o.status}">${ORDER_STATUS_LABELS_AR[o.status] || o.status}</span>
      </div>

      <div class="customer-line">
        👤 ${o.customer_name || "—"}
        <a href="tel:${o.customer_phone}">📞 ${o.customer_phone || "—"}</a>
      </div>

      ${o.delivery_mode === "delivery"
        ? `<div class="delivery-note">🚚 توصيل للمنزل — ${o.address || "بدون عنوان"}</div>`
        : `<div class="delivery-note">🏬 استلام من الصيدلية</div>`}

      <div class="items-list">
        ${(o.items || []).map(it => `
          <div class="item-row">
            <span class="name">${it.trade_name} <span class="sub">× ${it.qty}</span></span>
            <span>${formatPrice((it.price || 0) * (it.qty || 0))}</span>
          </div>`).join("")}
      </div>

      <div class="order-total">
        <span class="label">الإجمالي</span>
        <span class="value">${formatPrice(o.total)}</span>
      </div>

      ${o.notes ? `<div class="notes-line">📝 ${o.notes}</div>` : ""}

      <div class="order-actions">
        <select data-id="${o.id}" class="status-select">${statusOptions(o.status)}</select>
        <a class="wa-btn" href="${waLink}" target="_blank" rel="noopener">واتساب</a>
      </div>
      <div class="save-hint" id="hint-${o.id}"></div>
    </div>`;
  }).join("");

  ordersArea.querySelectorAll(".status-select").forEach(sel => {
    sel.addEventListener("change", async () => {
      const id = sel.getAttribute("data-id");
      const newStatus = sel.value;
      const hintEl = document.getElementById(`hint-${id}`);
      hintEl.textContent = "جاري الحفظ...";
      try {
        await setDoc(doc(db, COLLECTIONS.ORDERS, id), { status: newStatus }, { merge: true });
        const idx = allOrders.findIndex(o => o.id === id);
        if (idx !== -1) allOrders[idx].status = newStatus;
        hintEl.textContent = "✔ تم تحديث الحالة";
        const badge = sel.closest(".order-card").querySelector(".status-badge");
        badge.className = `status-badge status-${newStatus}`;
        badge.textContent = ORDER_STATUS_LABELS_AR[newStatus];
        buildTabs();
        setTimeout(() => { hintEl.textContent = ""; }, 1800);
      } catch (err) {
        hintEl.textContent = "❌ حصل خطأ: " + err.message;
      }
    });
  });
}

searchBox.addEventListener("input", () => {
  searchTerm = searchBox.value.trim();
  renderOrders();
});

document.getElementById("logout-btn").addEventListener("click", async () => {
  await logout();
  window.location.href = "admin-login.html";
});

(async function init() {
  await requireAdminAuth();
  const snap = await getDocs(collection(db, COLLECTIONS.ORDERS));
  allOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  buildTabs();
  renderOrders();
})();
</script>
</body>
</html>
