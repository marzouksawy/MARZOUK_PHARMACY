<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تقرير البيانات الناقصة — لوحة تحكم صيدلية د. مرزوق الصاوي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E2A2E; --petrol:#0F4C4F; --petrol-deep:#0A3638;
    --cream:#F6F2EA; --paper:#FFFEFB; --amber:#D98C4A; --line:rgba(14,42,46,0.12);
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'IBM Plex Sans Arabic', sans-serif; background:var(--cream); color:var(--ink);}
  h1,h2,h3{font-family:'Tajawal';}
  header{
    background:var(--petrol-deep); color:#fff; padding:16px 20px;
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
  }
  header h1{font-size:18px; margin:0;}
  header .actions{display:flex; gap:10px; align-items:center;}
  header a, header button{
    background:rgba(255,255,255,0.12); color:#fff; border:none; padding:9px 16px;
    border-radius:999px; font-family:'IBM Plex Sans Arabic'; font-size:13.5px; cursor:pointer; text-decoration:none;
  }
  .wrap{max-width:900px; margin:0 auto; padding:20px;}

  .summary{
    background:var(--paper); border:1px solid var(--line); border-radius:14px; padding:18px;
    margin-bottom:20px; display:flex; gap:24px; flex-wrap:wrap;
  }
  .summary .stat{text-align:center; flex:1; min-width:110px;}
  .summary .stat .num{font-family:'Tajawal'; font-weight:800; font-size:26px; color:var(--petrol);}
  .summary .stat .lbl{font-size:12px; color:rgba(14,42,46,0.6); margin-top:2px;}

  .filters{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
  .filter-chip{
    border:1px solid var(--line); background:var(--paper); padding:8px 16px; border-radius:999px;
    font-size:12.5px; cursor:pointer; white-space:nowrap;
  }
  .filter-chip.active{background:var(--petrol); color:#fff; border-color:var(--petrol);}

  .export-btn{
    background:var(--amber); color:#fff; border:none; padding:10px 18px; border-radius:10px;
    font-family:'Tajawal'; font-weight:700; font-size:13.5px; cursor:pointer; margin-bottom:18px;
  }

  .product-row{
    background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px 16px;
    display:flex; align-items:center; gap:14px; margin-bottom:10px;
  }
  .product-row .thumb{
    width:46px; height:46px; border-radius:8px; background:var(--cream); display:flex;
    align-items:center; justify-content:center; font-size:20px; flex-shrink:0; overflow:hidden;
  }
  .product-row .thumb img{width:100%; height:100%; object-fit:contain;}
  .product-row .info{flex:1; min-width:0;}
  .product-row .info h3{font-size:14px; margin:0 0 4px;}
  .product-row .info p{font-size:12px; color:rgba(14,42,46,0.6); margin:0;}
  .missing-tags{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;}
  .tag{font-size:10.5px; padding:2px 8px; border-radius:999px; font-weight:700;}
  .tag.alt{background:#FBEAEA; color:#C0392B;}
  .tag.dose{background:#FBEFE0; color:#B4700E;}
  .product-row .go-edit{
    background:var(--petrol); color:#fff; border:none; border-radius:8px; padding:9px 14px;
    font-size:12.5px; cursor:pointer; flex-shrink:0; text-decoration:none; font-family:'IBM Plex Sans Arabic';
  }

  .loading, .empty{text-align:center; padding:50px 20px; color:rgba(14,42,46,0.5);}
  .note{font-size:12px; color:rgba(14,42,46,0.55); background:var(--paper); border-radius:10px; padding:12px 14px; margin-bottom:18px; border:1px solid var(--line);}
</style>
</head>
<body>

<header>
  <h1>تقرير البيانات الناقصة</h1>
  <div class="actions">
    <a href="admin-dashboard.html">لوحة المنتجات</a>
    <button id="logout-btn">تسجيل الخروج</button>
  </div>
</header>

<div class="wrap">
  <div class="note">
    ⓘ التقرير ده بيعرض أي منتج ناقصه <strong>الأصناف البديلة</strong> أو <strong>ملاحظة الجرعة العامة</strong> (أو الاثنين). الهدف: حصر دقيق قبل إعادة إدخال البيانات المفقودة يدويًا.
  </div>

  <div class="summary" id="summary"></div>

  <div class="filters" id="filters"></div>

  <button class="export-btn" id="export-csv-btn">📄 تصدير القائمة كملف CSV</button>

  <div id="products-list" class="loading">جاري تحميل المنتجات...</div>
</div>

<script type="module">
  import { requireAdminAuth, logout, fetchAllProducts, CATEGORIES } from "./firebase-config.js";

  await requireAdminAuth();

  document.getElementById("logout-btn").addEventListener("click", async () => {
    await logout();
    window.location.href = "admin-login.html";
  });

  function isEmpty(val) {
    if (val === undefined || val === null) return true;
    if (Array.isArray(val)) return val.length === 0;
    if (typeof val === "string") return val.trim() === "";
    return false;
  }

  let allProducts = [];
  let missingProducts = [];
  let activeFilter = "both"; // both | alt_only | dose_only | either

  async function load() {
    const listEl = document.getElementById("products-list");
    listEl.innerHTML = `<div class="loading">جاري تحميل المنتجات...</div>`;

    allProducts = await fetchAllProducts();

    missingProducts = allProducts
      .map((p) => {
        const missingAlt = isEmpty(p.alternatives);
        const missingDose = isEmpty(p.general_dosage_note);
        return { ...p, missingAlt, missingDose };
      })
      .filter((p) => p.missingAlt || p.missingDose);

    renderSummary();
    renderFilters();
    renderList();
  }

  function renderSummary() {
    const bothCount = missingProducts.filter((p) => p.missingAlt && p.missingDose).length;
    const altOnly = missingProducts.filter((p) => p.missingAlt && !p.missingDose).length;
    const doseOnly = missingProducts.filter((p) => !p.missingAlt && p.missingDose).length;

    document.getElementById("summary").innerHTML = `
      <div class="stat"><div class="num">${allProducts.length}</div><div class="lbl">إجمالي المنتجات</div></div>
      <div class="stat"><div class="num">${missingProducts.length}</div><div class="lbl">منتج ناقص بيانات</div></div>
      <div class="stat"><div class="num">${bothCount}</div><div class="lbl">ناقص الاثنين معًا</div></div>
      <div class="stat"><div class="num">${altOnly}</div><div class="lbl">ناقص البدائل فقط</div></div>
      <div class="stat"><div class="num">${doseOnly}</div><div class="lbl">ناقص الجرعة فقط</div></div>
    `;
  }

  function renderFilters() {
    const chips = [
      { key: "either", label: "الكل" },
      { key: "both", label: "ناقص الاثنين" },
      { key: "alt_only", label: "ناقص البدائل فقط" },
      { key: "dose_only", label: "ناقص الجرعة فقط" },
    ];
    const filtersEl = document.getElementById("filters");
    filtersEl.innerHTML = chips
      .map((c) => `<div class="filter-chip ${c.key === activeFilter ? "active" : ""}" data-key="${c.key}">${c.label}</div>`)
      .join("");
    filtersEl.querySelectorAll(".filter-chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        activeFilter = chip.dataset.key;
        renderFilters();
        renderList();
      });
    });
  }

  function getFiltered() {
    if (activeFilter === "either") return missingProducts;
    if (activeFilter === "both") return missingProducts.filter((p) => p.missingAlt && p.missingDose);
    if (activeFilter === "alt_only") return missingProducts.filter((p) => p.missingAlt && !p.missingDose);
    if (activeFilter === "dose_only") return missingProducts.filter((p) => !p.missingAlt && p.missingDose);
    return missingProducts;
  }

  function renderList() {
    const listEl = document.getElementById("products-list");
    const filtered = getFiltered();

    if (!filtered.length) {
      listEl.innerHTML = `<div class="empty">مفيش منتجات في القسم ده 🎉</div>`;
      return;
    }

    listEl.innerHTML = filtered
      .map((p) => {
        const cat = CATEGORIES.find((c) => c.id === p.category) || {};
        const thumb = p.image ? `<img src="${p.image}" alt="">` : cat.icon || "💊";
        const tags = [
          p.missingAlt ? `<span class="tag alt">بدون بدائل</span>` : "",
          p.missingDose ? `<span class="tag dose">بدون جرعة</span>` : "",
        ].join("");
        return `
        <div class="product-row" data-id="${p.id}">
          <div class="thumb">${thumb}</div>
          <div class="info">
            <h3>${p.trade_name || "بدون اسم"}</h3>
            <p>${cat.name || ""} · ${p.price ?? "-"} ج.م</p>
            <div class="missing-tags">${tags}</div>
          </div>
          <button class="go-edit" data-search="${(p.trade_name || "").replace(/"/g, '&quot;')}">تعديل</button>
        </div>`;
      })
      .join("");

    listEl.querySelectorAll(".go-edit").forEach((btn) => {
      btn.addEventListener("click", () => {
        // بيودّيك للوحة المنتجات مع تمرير اسم المنتج في الرابط عشان تدوّر عليه بسرعة يدويًا
        const q = encodeURIComponent(btn.dataset.search || "");
        window.location.href = `admin-dashboard.html?q=${q}`;
      });
    });
  }

  document.getElementById("export-csv-btn").addEventListener("click", () => {
    const filtered = getFiltered();
    if (!filtered.length) {
      alert("مفيش منتجات لتصديرها في الفلتر الحالي.");
      return;
    }
    const rows = [
      ["Product ID", "الاسم التجاري", "alternatives", "general_dosage_note", "الصور", "تم التحقق"],
      ...filtered.map((p) => [
        p.id,
        (p.trade_name || "").replace(/"/g, "'"),
        p.missingAlt ? "ناقص" : "موجود",
        p.missingDose ? "ناقص" : "موجود",
        p.image ? "موجودة" : "غير موجودة",
        "",
      ]),
    ];
    const csvContent = "\uFEFF" + rows.map((r) => r.map((v) => `"${v}"`).join(",")).join("\n");
    const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const now = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    a.href = url;
    a.download = `missing_fields_${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  load();
</script>
</body>
</html>
